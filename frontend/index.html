<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítica - VotaSena</title>
    <meta name="description" content="Panel administrativo de resultados electorales VotaSena.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="admin-layout">

    <!-- Dialogo de confirmacion de cierre de sesion -->
    <div class="confirm-overlay" id="confirmLogoutOverlay">
        <div class="confirm-dialog">
            <div class="confirm-icon">
                <img src="assets/icons/logout.svg" alt="">
            </div>
            <p class="confirm-title" id="confirmLogoutTitle">Cerrar sesion</p>
            <p class="confirm-desc" id="confirmLogoutDesc">Esta accion cerrara la sesion activa.</p>
            <div class="confirm-actions">
                <button class="confirm-btn confirm-btn-cancel" id="confirmLogoutCancel">Cancelar</button>
                <button class="confirm-btn confirm-btn-confirm" id="confirmLogoutOk">Si, cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODULO: Autenticacion -->
    <auth-modal
        modal-title="Acceso al Dashboard"
        modal-desc="Ingresa el código de administrador para ver las estadísticas."
        placeholder="Código de administrador">
    </auth-modal>

    <!-- MODULO: Barra Lateral -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="assets/logo.png" alt="SENA Logo" class="sidebar-logo">
                <h2 class="sidebar-title">VotaSena</h2>
            </div>
            <button id="sidebarToggleBtn" class="toggle-btn toggle-desktop" title="Alternar Menú">
                <img src="assets/icons/menu.svg" class="icon-btn" alt="Menú">
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" id="navDashboard" class="nav-item active">
                <img src="assets/icons/dashboard.svg" class="icon" alt="">
                <span class="nav-text">Dashboard Analítica</span>
            </a>
            <div class="divider"></div>
            <a href="urna.html" target="_blank" class="nav-item btn-open-urna">
                <img src="assets/icons/urna.svg" class="icon" alt="">
                <span class="nav-text">Abrir Urna</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="logout-dropdown" id="logoutDropdownSidebar">
                <button class="btn-logout" id="btnLogoutTriggerSidebar">
                    <img src="assets/icons/logout.svg" class="icon" alt="">
                    <span class="nav-text">Cerrar sesion</span>
                </button>
                <div class="logout-menu" id="logoutMenuSidebar">
                    <button class="logout-option" data-action="urna">Solo urna</button>
                    <button class="logout-option" data-action="admin">Solo admin</button>
                    <div class="logout-divider"></div>
                    <button class="logout-option logout-option--all" data-action="all">Cerrar todo</button>
                </div>
            </div>
            <small>Sistema Institucional</small>
        </div>
    </aside>

    <!-- MODULO: Contenido Principal -->
    <main class="main-content">

        <header class="top-header">
            <div class="header-left">
                <button id="mobileToggleBtn" class="toggle-btn toggle-mobile" title="Alternar Menú">
                    <img src="assets/icons/menu.svg" class="icon-btn" alt="Menú">
                </button>
                <h1 class="panel-title">Dashboard Analítico</h1>
            </div>
            <div class="header-right">
                <div class="logout-dropdown" id="logoutDropdownHeader">
                    <button class="btn-logout-header" id="btnLogoutTriggerHeader" title="Cerrar sesiones">
                        <img src="assets/icons/logout.svg" width="18" height="18" alt="">
                        <span>Cerrar sesion</span>
                    </button>
                    <div class="logout-menu logout-menu--right" id="logoutMenuHeader">
                        <button class="logout-option" data-action="urna">Solo urna</button>
                        <button class="logout-option" data-action="admin">Solo admin</button>
                        <div class="logout-divider"></div>
                        <button class="logout-option logout-option--all" data-action="all">Cerrar todo</button>
                    </div>
                </div>
                <img src="assets/logo.png" alt="SENA Logo" class="mobile-logo">
            </div>
        </header>

        <!-- MODULO: Metricas -->
        <div class="widgets-grid">
            <div class="widget-card">
                <div class="widget-icon primary-bg">
                    <img src="assets/icons/users.svg" class="icon-widget" alt="Candidatos">
                </div>
                <div class="widget-info">
                    <h3 class="widget-title">Candidatos</h3>
                    <p class="widget-value" id="widgetTotalCandidatos">0</p>
                </div>
            </div>

            <div class="widget-card">
                <div class="widget-icon secondary-bg">
                    <img src="assets/icons/check-circle.svg" class="icon-widget" alt="Votos">
                </div>
                <div class="widget-info">
                    <h3 class="widget-title">Votos Emitidos</h3>
                    <p class="widget-value" id="widgetTotalVotos">0</p>
                </div>
            </div>

            <div class="widget-card widget-code">
                <div class="widget-code-left">
                    <div class="widget-icon dark-bg">
                        <img src="assets/icons/lock.svg" class="icon-widget" alt="Código">
                    </div>
                    <div class="widget-code-info">
                        <h3 class="widget-title">Código de Urna Actual</h3>
                        <p class="widget-code-desc">Cambie el código de acceso para los votantes</p>
                    </div>
                </div>
                <div class="widget-code-right">
                    <input type="password" id="voterCodeInput" class="code-input" placeholder="Cambiar código...">
                    <button onclick="cambiarCodigoVotante()" class="code-btn">Cambiar</button>
                </div>
            </div>
        </div>

        <!-- MODULO: Resultados -->
        <div class="panel-container">
            <div class="panel-header">
                <div class="panel-header-left">
                    <h2 class="panel-subtitle">Conteo en Vivo</h2>
                    <span id="countdownTimer" class="countdown-timer">
                        <img src="assets/icons/clock-white.svg" width="16" height="16" alt="">
                        Actualizando en 60s
                    </span>
                    <button id="toggleLiveUpdateBtn" class="toggle-btn live-toggle-btn" title="Pausar actualización en vivo">
                        <img src="assets/icons/pause.svg" id="liveUpdateIcon" class="icon-btn" alt="Pausar">
                    </button>
                </div>
                <div class="panel-actions">
                    <select id="jornadaDashboardFilter" class="jornada-dashboard-selector">
                        <option value="Todas">Todas las Jornadas</option>
                        <option value="Mañana">Jornada Mañana</option>
                        <option value="Tarde">Jornada Tarde</option>
                    </select>
                    <a href="javascript:void(0)" id="btnExportExcel" class="nav-item btn-excel">
                        <img src="assets/icons/excel.svg" class="icon" alt="">
                        <span>Excel</span>
                    </a>
                    <a href="javascript:void(0)" id="btnExportPdf" class="nav-item btn-pdf">
                        <img src="assets/icons/pdf.svg" class="icon" alt="">
                        <span>PDF</span>
                    </a>
                </div>
            </div>

            <div id="loader" class="loader"></div>
            <div id="tablaResultados" class="resultados-wrapper hidden-results">
                <div id="podiumContainer" class="podium-container"></div>
                <div id="listaResto" class="lista-resto"></div>
            </div>
        </div>

    </main>

    <script src="js/toast.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
