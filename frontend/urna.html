<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Virtual - VotaSena</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/urna.css">
</head>
<body>

    <!-- MODULO: Autenticacion -->
    <auth-modal
        modal-title="Acceso a la Urna"
        modal-desc="Pídale al administrador que ingrese el código de votante para continuar."
        placeholder="Código de acceso">
    </auth-modal>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- MÓDULO: Encabezado -->
    <header class="urna-top-header">
        <div class="urna-header-left">
            <img src="assets/logo.png" alt="SENA Logo" class="urna-logo">
            <div class="urna-header-text">
                <h1 class="urna-main-title">TARJETÓN ELECTORAL SENA</h1>
                <p class="urna-subtitle">Elección de Representantes 2026</p>
            </div>
        </div>

        <div class="urna-header-right">
            <div class="jornada-selector" tabindex="0" id="jornadaSelectorContainer">
                <span class="jornada-label">Jornada:</span>
                <div class="custom-select">
                    <span id="jornadaSelectedText">Mañana</span>
                    <img src="assets/icons/chevron-down.svg" class="chevron-icon" width="16" height="16" alt="">
                </div>
                <div class="custom-options" id="jornadaOptions">
                    <div class="custom-option selected" data-value="Mañana">Mañana</div>
                    <div class="custom-option" data-value="Tarde">Tarde</div>
                </div>
            </div>
        </div>
    </header>

    <input type="hidden" id="jornadaSelect" value="Mañana">

    <!-- MODULO: Tarjeton Electoral -->
    <div class="container">
        <div id="loader" class="loader"></div>
        <div id="tarjeton" class="candidatos-grid" style="display:none;"></div>
    </div>

    <!-- MODULO: Confirmacion de Voto -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h2>¿Confirmas tu voto?</h2>
            <div id="modalCandidatoInfo" class="modal-info">
                <img id="modalImg" src="" alt="Candidato" class="modal-img">
                <h3 id="modalNombre" class="modal-nombre">Nombre</h3>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button id="btnConfirmVote" class="btn-confirm" onclick="enviarVoto()">Sí, Votar</button>
            </div>
        </div>
    </div>

    <!-- MODULO: Notificacion de Exito -->
    <div class="modal-overlay" id="successScreen">
        <div class="modal-content success-modal">
                <img src="assets/icons/check-success.svg" class="success-check-img" width="80" height="80" alt="Voto registrado">
            <h2 class="success-title">¡Voto Registrado!</h2>
            <p class="success-subtitle">Gracias por participar en esta elección.</p>
            <div class="success-progress-bar"><div class="success-progress-fill" id="successProgressFill"></div></div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/urna.js"></script>
</body>
</html>
